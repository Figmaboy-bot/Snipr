<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snipr — Shared Folder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="screen-share" class="screen-app">
    <header class="app-nav">
      <div class="logo">
        <span class="logo-text">Snipr</span>
        <span class="logo-badge">Shared</span>
      </div>
      <div class="nav-right">
        <a href="/" class="btn-ghost-sm">Open Snipr</a>
      </div>
    </header>

    <div class="app-body">
      <div id="share-header" class="share-header hidden">
        <span id="share-folder-icon" class="share-folder-icon"></span>
        <div>
          <h2 id="share-folder-name" class="share-folder-name"></h2>
          <p id="share-folder-count" class="share-folder-count"></p>
        </div>
      </div>

      <div id="library-grid" class="library-grid"></div>

      <div id="share-not-found" class="empty-state hidden">
        <div class="empty-icon">🔗</div>
        <p>This share link is invalid or has been removed.</p>
      </div>

      <div id="library-loading" class="empty-state">
        <div class="empty-icon">☁</div>
        <p>Loading shared folder…</p>
      </div>
    </div>
  </div>

  <!-- ── Detail modal (read-only) ────────────────────────────────────────── -->
  <div id="detail-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detail-title" class="modal-title"></h3>
        <div class="modal-header-actions">
          <button id="btn-close-detail" class="btn-ghost-sm">✕</button>
        </div>
      </div>
      <div id="detail-tabs" class="detail-tabs">
        <div class="detail-tab active" data-tab="image">📷 Image</div>
        <div class="detail-tab" data-tab="code">&lt;/&gt; Code</div>
        <div class="detail-tab" data-tab="details">ℹ️ Details</div>
      </div>

      <div id="detail-image-tab" class="detail-pane">
        <img id="detail-screenshot" alt="Screenshot" class="detail-screenshot">
        <div id="detail-no-screenshot" class="detail-no-screenshot hidden">
          <span>📷</span><span>No screenshot available</span>
        </div>
      </div>

      <div id="detail-code-tab" class="detail-pane hidden">
        <div class="code-toolbar">
          <select id="code-type-select" class="select-input"></select>
          <button id="btn-copy-code" class="btn-ghost-sm">Copy</button>
        </div>
        <pre id="detail-code-pre" class="code-block"><code id="detail-current-code"></code></pre>
      </div>

      <div id="detail-info-tab" class="detail-pane hidden">
        <div class="detail-row"><span class="detail-row-label">🔗 Source</span><a id="detail-url" href="#" target="_blank" rel="noopener" class="detail-url"></a></div>
        <div class="detail-row"><span class="detail-row-label">📅 Saved</span><span id="detail-date"></span></div>
        <div class="detail-row hidden" id="detail-categories-row"><span class="detail-row-label">🏷️ Tags</span><div id="detail-categories"></div></div>
        <div class="detail-row hidden" id="detail-note-row"><span class="detail-row-label">📝 Note</span><span id="detail-note"></span></div>
        <div id="detail-assets"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="share.bundle.js"></script>
</body>
</html>
